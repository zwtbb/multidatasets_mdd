   <g id="text_1">
    <text style="font-weight: 700; font-size: 14.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1f2933" x="20.034" y="24.537894" transform="rotate(-0 20.034 24.537894)">Evidence summary: benchmark targets are not automatically interchangeable</text>
   </g>
   <g id="text_2">
    <text style="font-size: 9.2px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #697987" x="20.034" y="45.12096" transform="rotate(-0 20.034 45.12096)">The contribution is a bounded validity audit: representation signatures, measurement heterogeneity, and prediction instability are separated.</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 10.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1f2933" x="32.868" y="67.24152" transform="rotate(-0 32.868 67.24152)">Question layer</text>
   </g>
