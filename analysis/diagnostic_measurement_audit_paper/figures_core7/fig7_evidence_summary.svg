   </g>
   <g id="text_12">
    <text style="font-weight: 700; font-size: 9.6px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1f2933" x="44.4186" y="183.5784" transform="rotate(-0 44.4186 183.5784)">Latent target</text>
   </g>
   <g id="text_13">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1f2933" x="225.378" y="183.487837" transform="rotate(-0 225.378 183.487837)">Identity lower, transfer validity inconsistent</text>
   </g>
   <g id="text_14">
    <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1f2933" x="482.058" y="183.452681" transform="rotate(-0 482.058 183.452681)">Diagnostic target layer</text>
   </g>
   <g id="text_15">
    <text style="font-weight: 700; font-size: 9.6px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1f2933" x="44.4186" y="223.1544" transform="rotate(-0 44.4186 223.1544)">Calibration</text>
   </g>
   <g id="text_16">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1f2933" transform="translate(225.378 218.291752)">Target-side calibration output identity BA &gt;=</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1f2933" transform="translate(225.378 227.685923)">0.96</text>
   </g>
   <g id="text_17">
    <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1f2933" x="482.058" y="222.988837" transform="rotate(-0 482.058 222.988837)">Needs broader adaptation</text>
   </g>
   <g id="text_18">
    <text style="font-weight: 700; font-size: 9.6px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1f2933" x="44.4186" y="262.6179" transform="rotate(-0 44.4186 262.6179)">Supervision boundary</text>
   </g>
   <g id="text_19">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1f2933" transform="translate(225.378 257.792752)">Target-calibrated gains are same-budget, not</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1f2933" transform="translate(225.378 267.186923)">zero-label wins</text>
   </g>
   <g id="text_20">
    <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1f2933" x="482.058" y="262.489837" transform="rotate(-0 482.058 262.489837)">Measured method result</text>
   </g>
   <g id="text_21">
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #697987" x="32.868" y="304.24752" transform="rotate(-0 32.868 304.24752)">Recommended Discussion phrasing: systematic empirical evidence for representation discrepancies and potential measurement heterogeneity, challenging interchangeable clinical targets without claiming universal construct divergence.</text>
   </g>
