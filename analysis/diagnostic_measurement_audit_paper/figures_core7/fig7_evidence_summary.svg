   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1f2933" x="482.058" y="104.450681" transform="rotate(-0 482.058 104.450681)">Not interchangeable</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 9.6px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1f2933" x="44.4186" y="144.1149" transform="rotate(-0 44.4186 144.1149)">Clinical targets</text>
   </g>
   <g id="text_10">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1f2933" x="225.378" y="143.986837" transform="rotate(-0 225.378 143.986837)">L1/L2/L3 max item deltas 0.12/0.83/0.97</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; fill: #1f2933" transform="translate(482.058 139.219439)">Partially aligned,</text>
