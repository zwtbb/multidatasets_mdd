   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 10.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1f2933" x="482.058" y="67.24152" transform="rotate(-0 482.058 67.24152)">Conclusion</text>
   </g>
   <g id="text_6">
