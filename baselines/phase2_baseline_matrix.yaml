    dataset: edaic
    display_dataset: E-DAIC
    modality: Text
    input_modalities: [text]
    task: PHQ-8 regression
    task_type: severity_regression
    target: phq8_total
    model: TF-IDF + Ridge
    family: text_tfidf
    split_policy: official_subject_level_split

  - id: edaic_text_binary_tfidf_logistic
