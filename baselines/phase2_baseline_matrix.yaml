version: 1
stage: phase2_unified_baselines

policy:
  objective: credible_repeatable_baseline_matrix_before_method_design
  pretrained_encoder_policy: frozen_by_default
  small_dataset_finetuning_policy: no_full_finetuning_at_phase2_start
  minimum_random_seeds: 5
  random_seeds: [0, 1, 2, 3, 4]
  bootstrap:
    enabled: true
    resamples: 1000
    confidence_level: 0.95
    resample_unit: subject_id
  hyperparameter_selection: dev_or_inner_cv_only
  test_set_policy: never_select_hyperparameters_on_test
  forbidden_model_components:
    - hypergraph
    - causal_module
    - llm_summary
    - contrastive_learning
    - personality_gating
    - weak_summary_supervision
    - full_encoder_finetuning_by_default

metric_sets:
  binary_classification:
    - Macro-F1
    - Balanced Accuracy
    - AUROC
    - AUPRC
    - ECE
    - Brier Score
  severity_regression:
    - CCC
    - MAE
    - RMSE
    - Spearman
  ordinal_prediction:
    - QWK
    - Ordinal MAE
    - Macro-F1
    - ECE
    - Brier Score

coverage_requirements:
  single_modal_families:
    - text_tfidf
    - text_embedding_mlp
    - text_sentence_attention
    - audio_egemaps
    - audio_wavlm
    - audio_wav2vec2
    - video_openface
    - video_official_temporal_pooling
    - gait_statistics
    - gait_imu_temporal_encoder
  multimodal_families:
    - early_fusion
    - late_fusion
    - gated_fusion
  public_reproduction:
    edaic:
      - avec_edaic_official
      - questmf
      - existing_text_baseline
      - existing_audio_baseline
      - existing_late_fusion_baseline
    mpdd_avg_2026:
      - mpdd_official
      - p3hf_compatibility_gated
    pdch:
      - pdch_official_text_only
      - pdch_official_audio_text
    eatd:
      - eatd_official_gru
      - eatd_official_bilstm
    modma:
      - modma_egemaps
      - modma_frozen_wavlm
      - modma_task_specific_cross_task

runs:
